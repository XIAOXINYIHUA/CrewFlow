name: crewflow

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - CREWFLOW_DATABASE_URL=postgresql+psycopg2://crewflow:crewflow@db:5432/crewflow
      - CREWFLOW_OUTPUT_DIR=/app/output
      - CREWFLOW_ARTIFACTS_DIR=/app/data/artifacts
    volumes:
      - crewflow_output:/app/output
      - crewflow_artifacts:/app/data/artifacts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crewflow
      POSTGRES_PASSWORD: crewflow
      POSTGRES_DB: crewflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    command: python web.py
    ports:
      - "7860:7860"
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  crewflow_output:
  crewflow_artifacts:
